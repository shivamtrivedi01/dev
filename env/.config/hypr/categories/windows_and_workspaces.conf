# Windows and Workspaces

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Rules
windowrule {
  name = windowrule-3
  float = on
  pin = on
  match:class = ^(firefox)$
  match:title = ^(Picture-in-Picture)$
}

windowrule {
  name = windowrule-4
  opacity = 0.3 0.4
  match:class = ^(ghostty)$
}

windowrule {
  name = windowrule-5
  opacity = 0.85 0.85
  match:class = ^(obsidian)$
}

windowrule {
  name = windowrule-6
  opacity = 0.85 0.85
  match:class = ^(org.gnome.Nautilus)$
}

# windowrule = opacity 0.85 0.85,class:^(org.telegram.desktop)$

# Workspaces
# workspace = 1, monitor:eDP-1
# workspace = 2, monitor:eDP-1
# workspace = 3, monitor:eDP-1

# XWayland video bridge
windowrule {
  name = windowrule-7
  opacity = 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  no_focus = on
  match:class = ^(xwaylandvideobridge)$
}


windowrule {
  name = windowrule-8
  float = on
  size = 800 600
  center = on
  match:class = ^(org\.pulseaudio\.pavucontrol)$
}

